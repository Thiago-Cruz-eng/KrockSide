name: ci

# Gate de qualidade do repositório, em duas camadas:
#
#   build-and-test  lint + tipo + testes de componente/integração (MSW) + build. Rápido,
#                   sem dependência externa. É o gate que bloqueia qualquer merge.
#   e2e             Playwright contra o sistema inteiro: navegador → Vite → API .NET →
#                   MongoDB, sem mock em camada nenhuma.
#
# O E2E existe porque a camada de componentes não é capaz de pegar a classe de bug que mais
# apareceu neste projeto: dublê de teste que espelha o erro do código. Houve teste verde em
# `**/get/**` — a rota ERRADA que o front chamava — enquanto entrar em sala respondia 404 em
# produção. Bug em junção só aparece quando as partes reais conversam.
# O filtro de branch fica só no push. Em `pull_request` ele ficava em `main` e, com isso, PR
# empilhado sobre outra branch não disparava check nenhum — justamente onde mais se quer o
# gate, porque a base ainda não foi revisada.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend

      # Qual backend testar.
      #
      # O E2E exercita o CONTRATO entre front e back, e as duas pontas evoluem em PRs
      # separados. Fixar `main` reprovaria toda mudança coordenada; e uma variável de
      # repositório, sendo global, desviaria também os PRs que nada têm a ver com ela.
      #
      # Então: se existe no backend uma branch com o MESMO nome desta, é ela — é o sinal
      # mais barato de "estes dois PRs são as duas metades da mesma mudança", e não exige
      # lembrar de configurar nada. Senão, main.
      - name: Resolver ref do backend
        id: backend-ref
        run: |
          repo="https://github.com/${{ github.repository_owner }}/Hibrygame.git"
          override="${{ vars.HIBRYGAME_REF }}"
          branch="${{ github.head_ref || github.ref_name }}"

          if [ -n "$override" ]; then
            echo "ref=$override" >> "$GITHUB_OUTPUT"
            echo "Ref vinda da variável HIBRYGAME_REF: $override"
          elif git ls-remote --exit-code --heads "$repo" "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
            echo "Branch homônima encontrada no backend: $branch"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Sem branch '$branch' no backend; testando contra main."
          fi

      # Ambos os repos são públicos, por isso o token padrão do job basta — se algum deles
      # virar privado, este passo passa a exigir um PAT com leitura no backend.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Hibrygame
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install (frontend)
        working-directory: frontend
        run: npm ci

      # Só o Chromium: os testes não verificam nada específico de motor, e baixar os três
      # navegadores dobraria o tempo do job sem cobrir mais nada.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Debug de propósito, não Release: o `dotnet run` do webServer usa a configuração
      # padrão, então compilar em Release aqui não aproveitaria nada e a API recompilaria
      # inteira dentro do timeout de 180s.
      - name: Build API
        working-directory: backend
        run: dotnet build Hibrygame.sln

      - name: Run E2E
        working-directory: frontend
        run: npx playwright test
        env:
          CI: true
          # A suíte sobe a API e o Vite sozinha (webServer no playwright.config.ts) e
          # semeia os usuários no globalSetup. Nada a preparar à mão.
          HIBRYGAME_PATH: ${{ github.workspace }}/backend
          E2E_API_URL: http://localhost:5001
          E2E_BASE_URL: http://localhost:3000
          # Chave só de CI, descartável. Precisa de 32+ bytes: Program.cs recusa subir com
          # chave curta, e um segredo real não pertence a um workflow.
          Jwt__Key: ci-only-key-not-a-secret-32-bytes-min
          Mongo__ConnectionString: mongodb://localhost:27017
          Mongo__Database: hibrygame_e2e

      # Trace, vídeo e screenshot das falhas. É o que torna um E2E vermelho no CI
      # diagnosticável sem tentar reproduzir na máquina de alguém.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
