name: ci

# Gate de qualidade do repositório, em duas camadas:
#
#   build-and-test  lint + tipo + testes de componente/integração (MSW) + build. Rápido,
#                   sem dependência externa. É o gate que bloqueia qualquer merge.
#   e2e             Playwright contra o sistema inteiro: navegador → Vite → API .NET →
#                   MongoDB, sem mock em camada nenhuma.
#
# O E2E existe porque a camada de componentes não é capaz de pegar a classe de bug que mais
# apareceu neste projeto: dublê de teste que espelha o erro do código. Houve teste verde em
# `**/get/**` — a rota ERRADA que o front chamava — enquanto entrar em sala respondia 404 em
# produção. Bug em junção só aparece quando as partes reais conversam.
# O filtro de branch fica só no push. Em `pull_request` ele ficava em `main` e, com isso, PR
# empilhado sobre outra branch não disparava check nenhum — justamente onde mais se quer o
# gate, porque a base ainda não foi revisada.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Histórico completo: o diff-cover precisa comparar com a base do PR, e um checkout raso
      # não tem o ancestral comum.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # O piso global de cobertura mora em vite.config.ts (thresholds) e falha aqui dentro.
      - name: Test
        run: npm run test:ci
        env:
          CI: true

      # Catraca sobre o código NOVO.
      #
      # O piso global impede que a cobertura caia; este passo cobra que o que você está
      # adicionando agora venha testado. É a única pergunta acionável dentro de um PR — exigir
      # um número absoluto alto sobre a base inteira ou trava todo mundo ou não dispara nunca.
      #
      # 80% e não 100%: sobra folga para guarda defensiva e caminho de erro que não vale um
      # teste dedicado. Só roda em PR — em push para main não existe base com que comparar.
      - name: Cobertura do código novo
        if: github.event_name == 'pull_request'
        run: |
          pip install --quiet diff-cover
          diff-cover coverage/cobertura-coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=80 \
            --markdown-report=coverage-diff.md
          cat coverage-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend

      # Qual backend testar.
      #
      # O E2E exercita o CONTRATO entre front e back, e as duas pontas evoluem em PRs
      # separados. Fixar `main` reprovaria toda mudança coordenada; e uma variável de
      # repositório, sendo global, desviaria também os PRs que nada têm a ver com ela.
      #
      # Então: se existe no backend uma branch com o MESMO nome desta, é ela — é o sinal
      # mais barato de "estes dois PRs são as duas metades da mesma mudança", e não exige
      # lembrar de configurar nada. Senão, main.
      #
      # O pareamento por nome só é seguro se o nome identificar UMA mudança. Com vários devs
      # isso deixa de ser automático: dois `fix/turno` em repos diferentes, de pessoas
      # diferentes, seriam pareados com toda a confiança — verde enganoso, que é pior que
      # vermelho. Daí a exigência de identificador de tarefa no nome; nomes genéricos são
      # recusados abaixo.
      - name: Resolver ref do backend
        id: backend-ref
        run: |
          repo="https://github.com/${{ github.repository_owner }}/Hibrygame.git"
          override="${{ vars.HIBRYGAME_REF }}"
          branch="${{ github.head_ref || github.ref_name }}"

          if [ -n "$override" ]; then
            echo "ref=$override" >> "$GITHUB_OUTPUT"
            # Anotação, não log: a variável é GLOBAL ao repositório, então enquanto existir
            # ela desvia todo PR — inclusive os de outras pessoas, que não fazem ideia.
            echo "::warning title=E2E desviado por variável::Este PR foi testado contra Hibrygame@${override}, e não contra a branch homônima ou main. A variável HIBRYGAME_REF é global e afeta TODOS os PRs deste repositório enquanto existir. Se ela não é sua, avise quem a criou; se é, apague-a assim que o par entrar (gh variable delete HIBRYGAME_REF)."
          elif git ls-remote --exit-code --heads "$repo" "$branch" >/dev/null 2>&1; then
            # Pareamento por nome exige nome que identifique uma tarefa. Sem isso, a
            # homonímia pode ser coincidência entre trabalhos de pessoas diferentes.
            if ! echo "$branch" | grep -qiE '[a-z]+-[0-9]+|[0-9]{3,}'; then
              echo "::error title=Nome de branch ambíguo para pareamento::Existe uma branch '${branch}' no Hibrygame, mas o nome não contém identificador de tarefa, então não dá para afirmar que é a outra metade DESTA mudança — pode ser trabalho de outra pessoa. Renomeie as duas para incluir o identificador (ex.: feat/HIB-123-${branch##*/}). Ver docs/fluxo-de-trabalho.md no Hibrygame."
              exit 1
            fi
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
            echo "Branch homônima encontrada no backend: $branch"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Sem branch '$branch' no backend; testando contra main."
          fi

      # Ambos os repos são públicos, por isso o token padrão do job basta — se algum deles
      # virar privado, este passo passa a exigir um PAT com leitura no backend.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Hibrygame
          ref: ${{ steps.backend-ref.outputs.ref }}
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install (frontend)
        working-directory: frontend
        run: npm ci

      # Só o Chromium: os testes não verificam nada específico de motor, e baixar os três
      # navegadores dobraria o tempo do job sem cobrir mais nada.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Debug de propósito, não Release: o `dotnet run` do webServer usa a configuração
      # padrão, então compilar em Release aqui não aproveitaria nada e a API recompilaria
      # inteira dentro do timeout de 180s.
      - name: Build API
        working-directory: backend
        run: dotnet build Hibrygame.sln

      - name: Run E2E
        working-directory: frontend
        run: npx playwright test
        env:
          CI: true
          # A suíte sobe a API e o Vite sozinha (webServer no playwright.config.ts) e
          # semeia os usuários no globalSetup. Nada a preparar à mão.
          HIBRYGAME_PATH: ${{ github.workspace }}/backend
          E2E_API_URL: http://localhost:5001
          E2E_BASE_URL: http://localhost:3000
          # Chave só de CI, descartável. Precisa de 32+ bytes: Program.cs recusa subir com
          # chave curta, e um segredo real não pertence a um workflow.
          Jwt__Key: ci-only-key-not-a-secret-32-bytes-min
          Mongo__ConnectionString: mongodb://localhost:27017
          Mongo__Database: hibrygame_e2e

      # Trace, vídeo e screenshot das falhas. É o que torna um E2E vermelho no CI
      # diagnosticável sem tentar reproduzir na máquina de alguém.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
